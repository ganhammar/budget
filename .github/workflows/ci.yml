name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    # Native AOT cannot cross-compile, so the build host must match the Lambda
    # architecture: linux-arm64. This job is what actually proves the AOT build
    # works, which is the failure mode `dotnet run` never surfaces.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: AOT=true ./api/scripts/publish.sh

      - name: Verify the artifacts
        run: |
          for dir in api/publish api/publish-reminders; do
            test -x "$dir/bootstrap"
            file "$dir/bootstrap" | tee /dev/stderr | grep -q 'ARM aarch64'
            echo "$dir: $(du -h "$dir/bootstrap" | cut -f1)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: api-aot-linux-arm64
          path: api/publish/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: reminders-aot-linux-arm64
          path: api/publish-reminders/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test api/Budget.slnx --configuration Release

  e2e:
    # The whole path: a browser, the dev server's proxy, the API, and a real
    # DynamoDB. It is the only place the wiring between them is exercised.
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8042:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Create the table
        run: ./api/scripts/create-local-table.sh
        env:
          DYNAMODB_ENDPOINT: http://localhost:8042
          TABLE_NAME: budget-e2e

      - run: npm run e2e
        working-directory: web
        env:
          DYNAMODB_ENDPOINT: http://localhost:8042
          TABLE_NAME: budget-e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Verify the calculation engine against the original spreadsheet
        run: npm run verify
        working-directory: web

      - run: npm run build
        working-directory: web

  deploy:
    needs: [api, web, test, e2e]
    # Dispatch deploys too, so a deploy can be re-run without an empty commit
    # when a push event goes missing or a deploy needs repeating unchanged.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: api-aot-linux-arm64
          path: api/publish

      - uses: actions/download-artifact@v8
        with:
          name: reminders-aot-linux-arm64
          path: api/publish-reminders

      - name: Restore the executable bit
        # Artifacts do not preserve file modes, and provided.al2023 will not run a
        # bootstrap that is not executable.
        run: chmod +x api/publish/bootstrap api/publish-reminders/bootstrap

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      - name: Build the web app
        run: npm ci && npm run build
        working-directory: web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        # Both stacks: the certificate lives in us-east-1 because CloudFront will
        # not read one from anywhere else.
        run: npm ci && npx cdk deploy --all --require-approval never
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
