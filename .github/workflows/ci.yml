name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    # Native AOT cannot cross-compile, so the build host must match the Lambda
    # architecture: linux-arm64. This job is what actually proves the AOT build
    # works, which is the failure mode `dotnet run` never surfaces.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: AOT=true ./api/scripts/publish.sh

      - name: Verify the artifact
        run: |
          test -x api/publish/bootstrap
          file api/publish/bootstrap | tee /dev/stderr | grep -q 'ARM aarch64'
          echo "Size: $(du -h api/publish/bootstrap | cut -f1)"

      - uses: actions/upload-artifact@v7
        with:
          name: api-aot-linux-arm64
          path: api/publish/
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Verify the calculation engine against the original spreadsheet
        run: npm run verify
        working-directory: web

      - run: npm run build
        working-directory: web

  deploy:
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: api-aot-linux-arm64
          path: api/publish

      - name: Restore the executable bit
        # Artifacts do not preserve file modes, and provided.al2023 will not run a
        # bootstrap that is not executable.
        run: chmod +x api/publish/bootstrap

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      - name: Build the web app
        run: npm ci && npm run build
        working-directory: web

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        run: npm ci && npx cdk deploy Budget --require-approval never
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
