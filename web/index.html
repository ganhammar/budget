<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="pnkt" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS will not accept an SVG here, and falls back to a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>pnkt</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme. The
      // member record is the source of truth; this reads the local mirror of it,
      // which is all that is available before the budget has loaded.
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem('budget.theme') || 'system';
          dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          dark = false;
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        // The status bar of an installed app is painted from theme-color, so it
        // has to carry the paper of the theme actually applied rather than the
        // one the OS asked for. Mirrors --paper in styles.css; the stylesheet is
        // not loaded yet, so the value cannot be read from it here.
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#14130f' : '#fbfaf6');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
