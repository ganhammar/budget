<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The status bar of an installed app is painted from the theme-color the
         document was parsed with, and Chrome will not take a light one while the
         phone is in dark mode: it paints its own grey instead. One meta per
         appearance, mirroring --paper in styles.css, so the value is already the
         paper the page is about to use. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14130f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="pnkt" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS will not accept an SVG here, and falls back to a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>pnkt</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme. The
      // member record is the source of truth; this reads the local mirror of it,
      // which is all that is available before the budget has loaded.
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem('budget.theme') || 'system';
          dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          dark = false;
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        // A theme set against the OS wants the other meta's paper, so both are
        // written with the one actually applied and whichever the appearance
        // selects is right. The stylesheet is not loaded yet, so the value is the
        // literal rather than the computed --paper.
        var paper = dark ? '#14130f' : '#fbfaf6';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', paper);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
